name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    env:
      PYTHONIOENCODING: utf-8
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run the offline mock
        run: node src/index.js mock --cycles 2

